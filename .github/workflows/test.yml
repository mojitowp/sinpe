name: Compatibility and regression checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer check
      - run: node --check includes/checkout.js && node --check public/js/mojito-sinpe-public.js && node --test tests/blocks.test.cjs
      - run: composer audit --locked
      - run: python3 tools/build.py /tmp/mojito-sinpe-1.3.0.zip
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.2', wp: '6.2.15', wc: '8.2.3'}
          - {php: '8.2', wp: '6.7.8', wc: '9.5.2'}
          - {php: '8.3', wp: '6.7.8', wc: '9.5.2'}
          - {php: '8.4', wp: '6.7.8', wc: '9.5.2'}
          - {php: '8.2', wp: '7.1.4', wc: '11.2.1'}
          - {php: '8.3', wp: '7.1.4', wc: '11.2.1'}
          - {php: '8.4', wp: '7.1.4', wc: '11.2.1', plugin_check: '1'}
          - {php: '8.5', wp: '7.1.4', wc: '11.2.1'}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
          extensions: mysqli, mbstring, curl
          coverage: none
      - run: tools/test-integration.sh
        env:
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
          SINPE_PLUGIN_CHECK: ${{ matrix.plugin_check || '0' }}
  upcoming:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: wp-cli
          extensions: mysqli, mbstring, curl
          coverage: none
      - name: Test upcoming platforms without declaring stable support
        run: tools/test-integration.sh
        env:
          WP_VERSION: 7.2-beta2
          WC_VERSION: 11.3.0-beta.1
          WC_PACKAGE_URL: https://github.com/woocommerce/woocommerce/releases/download/11.3.0-beta.1/woocommerce.zip
